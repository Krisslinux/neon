workflows:
  neonhub-debug-apk:
    name: Neon Hub - Installable APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build debug APK (Gradle 8.9)
        script: |
          set -eu
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-8.9-bin.zip"
          GRADLE_EXEC="$CM_BUILD_DIR/gradle-8.9/bin/gradle"

          # The preinstalled Gradle may be older than the Android plugin requires.
          # Always invoke Gradle 8.9, rather than the version on PATH.
          if [ ! -x "$GRADLE_EXEC" ]; then
            curl --fail --location --retry 3 --silent --show-error \
              "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
              --output "$GRADLE_ZIP"
            unzip -q -o "$GRADLE_ZIP" -d "$CM_BUILD_DIR"
          fi

          "$GRADLE_EXEC" --version
          "$GRADLE_EXEC" :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - app/build/outputs/apk/debug/*.apk
