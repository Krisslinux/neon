workflows:
  neonhub-debug-apk:
    name: Neon Hub - Installable APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          set -eu
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle"
          if command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --no-daemon --stacktrace
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon --stacktrace
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - app/build/outputs/apk/debug/*.apk
